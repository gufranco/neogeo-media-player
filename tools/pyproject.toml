[project]
name = "neogeomedia"
version = "2.0.0"
description = "Offline baker that turns a video file into a Neo Geo AES cartridge movie ROM"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fmvcore",
    "numpy==2.5.4",
]

[tool.uv.sources]
fmvcore = { path = "../fmv-core-python", editable = true }

[dependency-groups]
dev = [
    "faker==40.43.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "python-semantic-release>=10.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neogeomedia"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "ARG", "PTH"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reads_real_store: reads the project tier file without writing it",
]
addopts = "-q"

