[project]
name = "neogeomedia"
version = "2.0.0"
description = "Offline baker that turns a video file into a Neo Geo AES cartridge movie ROM"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fmvcore",
    "numpy==2.5.4",
]

[tool.uv.sources]
fmvcore = { path = "../fmv-core-python", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "faker==40.43.0",
]
release = [
    "python-semantic-release==10.7.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neogeomedia"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "ARG", "PTH"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["neogeomedia"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reads_real_store: reads the project tier file without writing it",
]
addopts = "-q"

