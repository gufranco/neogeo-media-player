version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      base-image:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns:
          - "*"
